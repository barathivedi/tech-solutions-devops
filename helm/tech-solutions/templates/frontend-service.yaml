apiVersion: v1
kind: Service
metadata:
  name: tech-solutions-frontend
  labels:
    app: tech-solutions-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: tech-solutions-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      nodePort: {{ .Values.frontend.service.nodePort }}
      protocol: TCP
